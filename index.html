<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="img/logo.png" />

    <!-- スマホ対応 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- タイトル -->
    <title>株式会社デンケンスペース | Web制作</title>

    <!-- 検索結果に出る説明文 -->
    <meta
      name="description"
      content="株式会社デンケンスペースは、Web制作・システム開発・食品貿易事業を展開しています。日本の伝統とITで未来をつなぐ会社です。"
    />

    <!-- SNSシェア用（OGP） -->
    <meta property="og:title" content="株式会社デンケンスペース" />
    <meta property="og:description" content="Web制作・システム開発。" />
    <meta property="og:image" content="https://your-domain.com/og-image.jpg" />
    <meta property="og:url" content="https://your-domain.com" />
    <meta property="og:type" content="website" />

    <!-- Twitterカード -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="株式会社デンケンスペース" />
    <meta name="twitter:description" content="Web制作・システム開発。" />
    <meta name="twitter:image" content="https://your-domain.com/og-image.jpg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
